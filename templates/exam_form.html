<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Start Exam - {{ course_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <div class="exam-container">
      <div class="exam-header">
        <div>
          <div class="exam-title">Start Exam: {{ course_title }}</div>
          <div class="exam-sub">Complete your exam registration details before beginning.</div>
        </div>
      </div>

      <form method="POST" action="{{ url_for('exam.exam_take', course_id=course_id) }}" class="exam-form">
        <div class="form-row">
          <label>Full Name</label>
          <input type="text" name="name" value="{{ name }}" required />
        </div>
        <div class="form-row">
          <label>Email</label>
          <input type="email" name="email" value="{{ email }}" required />
        </div>
        <div class="form-row">
          <label>College Name</label>
          <input type="text" name="college" value="{{ college }}" placeholder="Your college name" required />
        </div>
        <div class="form-row">
          <label>Address</label>
          <input type="text" name="address" value="{{ address }}" placeholder="Street address" required />
        </div>
        <div class="form-row">
          <label>City</label>
          <input type="text" name="city" value="{{ city }}" placeholder="City" required />
        </div>
        <div class="form-row">
          <label>State</label>
          <input type="text" name="state" value="{{ state }}" placeholder="State" required />
        </div>
        <div class="form-row">
          <label>Phone</label>
          <input type="tel" name="phone" value="{{ phone }}" placeholder="Phone number" required />
        </div>

        <div class="exam-actions">
          <button type="submit">Start Exam</button>
          <a class="secondary-link" href="{{ url_for('dashboard') }}">Cancel and return to dashboard</a>
        </div>
      </form>
    </div>
  </body>
</html>
